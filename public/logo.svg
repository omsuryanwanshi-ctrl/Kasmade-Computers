<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="30%" stop-color="#E5B942" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#997312" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14264A" />
      <stop offset="50%" stop-color="#0B162C" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon / Shield Badge -->
  <g transform="translate(10, 10)">
    <!-- Outer gold ring -->
    <polygon points="50,2 95,26 95,74 50,98 5,74 5,26" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <polygon points="50,8 88,28 88,70 50,90 12,70 12,28" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,2" opacity="0.6" />
    
    <!-- Tech circuit tracks -->
    <path d="M 25 35 L 40 35 L 45 42 L 55 42" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <circle cx="25" cy="35" r="2.5" fill="url(#goldGrad)"/>
    <path d="M 75 65 L 60 65 L 55 58 L 45 58" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <circle cx="75" cy="65" r="2.5" fill="url(#goldGrad)"/>

    <!-- Red tech accent point -->
    <circle cx="50" cy="50" r="4.5" fill="url(#redGrad)" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="2" fill="#FFFFFF"/>

    <!-- KDC Monogram inside Icon -->
    <text x="50" y="58" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="1">KDC</text>
    
    <!-- Year Tag -->
    <rect x="30" y="78" width="40" height="12" rx="3" fill="#D4AF37"/>
    <text x="50" y="87" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" fill="#0B162C" letter-spacing="0.5">EST. 2012</text>
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(125, 20)">
    <!-- Main Business Title -->
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="0.8">
      KASMADE <tspan fill="url(#goldGrad)">DATA</tspan> CORPORATION
    </text>

    <!-- Subtitle / Brand Category -->
    <text x="0" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="2.5">
      KDC <tspan fill="#D4AF37">•</tspan> MULTI BRAND TECHNOLOGY STORE
    </text>

    <!-- Tagline Banner -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="345" height="18" rx="3" fill="#0D2147" stroke="#D4AF37" stroke-width="0.75" />
      <circle cx="10" cy="9" r="2.5" fill="#EF4444" />
      <text x="20" y="12.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#E2E8F0" letter-spacing="1">
        “SATISFACTION IS OUR MOTTO”
      </text>
      <text x="335" y="12.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#F3C343" text-anchor="end">
        DEOLA, NASHIK
      </text>
    </g>
  </g>
</svg>
